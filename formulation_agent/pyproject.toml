[project]
name = "rfperfusion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.122.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "uvicorn>=0.52.3",
]

[project.scripts]
formulate = "formulation_agent.cli:main"
formulate-web = "formulation_agent.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formulation_agent"]
artifacts = ["src/formulation_agent/static/*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["live: hits the live Paperclip corpus"]
