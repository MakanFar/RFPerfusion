[project]
name = "litkb"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." makes `litkb` importable; ".." makes the sibling
# `litterature_search_from_concept.paperclip_kb` import in the merged
# test_paperclip_kb.py resolve, since that test is written to run from the
# repository root.
pythonpath = [".", ".."]
