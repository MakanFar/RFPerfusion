[project]
name = "rfperfusion"
version = "0.1.0"
description = "Literature-grounded agentic pipeline designing a SWIR-actuated TlpA thermal switch"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.6",
]

[project.optional-dependencies]
# The LLM-orchestrator layer (added when we wrap stages as agent workers).
agents = [
  "anthropic>=0.40",
  "claude-agent-sdk>=0.1",
]

[tool.uv]
package = false
